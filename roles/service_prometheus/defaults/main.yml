# Entrypoint:      main

# prom/prometheus image tag.
prometheus_image_version__default: latest

# Host port mapped to Prometheus 9090.
prometheus_host_port__default: '9090'

# TSDB retention by time (e.g. 30d).
prometheus_retention_time__default: 30d

# TSDB retention by size — hard ceiling so it can't fill the disk.
prometheus_retention_size__default: 20GB

# Shared external docker network the stack joins.
prometheus_network__default: monitoring

# DEFAULT TRUE, deliberately. The template wraps BOTH `alerting:` and `rule_files:` in this flag, so a false/absent value re-renders prometheus.yml with alerting REMOVED: Prometheus then loads zero alert rules, and a host looks monitored while it cannot alert. A default of false would mean 'does nothing', which for a monitoring stack is the opposite of safe.
prometheus_alertmanager_enabled__default: true

# Alertmanager endpoint Prometheus sends alerts to.
prometheus_alertmanager_target__default: alertmanager:9093
