---
- name: Converge — render the prometheus compose only (no docker)
  hosts: localhost
  gather_facts: false
  vars:
    prometheus__name: prometheus
    prometheus_image_version: "v3.0.0"
    prometheus_host_port: "9090"
    prometheus_retention_time: "30d"
    prometheus_retention_size: "20GB"
    prometheus_network: "monitoring"
    prometheus__config_dir: "/opt/prometheus"
    render_dir: /tmp/molecule-prometheus
  tasks:
    - name: Make render dir
      ansible.builtin.file: { path: "{{ render_dir }}", state: directory, mode: "0755" }
    - name: Render the compose
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../files/docker-compose.yml.j2"
        dest: "{{ render_dir }}/docker-compose.yml"
        mode: "0644"
