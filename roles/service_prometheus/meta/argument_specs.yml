        description:
          - Shared external docker network the stack joins.
        type: str
        required: false
        default: monitoring
      prometheus_alertmanager_enabled:
        description:
          - "DEFAULT TRUE, deliberately. The template wraps BOTH `alerting:` and `rule_files:` in this flag, so a false/absent value re-renders prometheus.yml with alerting REMOVED: Prometheus then loads zero alert rules, and a host looks monitored while it cannot alert. A default of false would mean 'does nothing', which for a monitoring stack is the opposite of safe."
