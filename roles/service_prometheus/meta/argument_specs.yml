argument_specs:
  main:
    short_description: Deploys Prometheus (retention-capped) on the shared monitoring network
    version_added: '1.0'
    author: Collection maintainers
    options:
      prometheus_image_version:
        description:
          - prom/prometheus image tag.
        type: str
        required: false
        default: latest
      prometheus_host_port:
        description:
          - Host port mapped to Prometheus 9090.
