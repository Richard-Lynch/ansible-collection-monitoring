---
# Install (or remove) ONE owner's Prometheus alert rules. See meta/argument_specs.py for the
# interface and README.md for the why.

- name: Resolve declared options over their generated defaults
  # GENERATED from meta/argument_specs.py — binds every declared option to its default, so a
  # default can never be declared-but-dead (the variable evaluating Undefined at run time).
  ansible.builtin.include_tasks: _resolve_defaults.yml

- name: Validate the owner name
  # The owner becomes a filename. Without this an owner of '../prometheus' would write outside the
  # rules directory, and one containing a glob character would be matched by the *.yml rule_files
  # glob in ways the author did not intend. An explicit class is used rather than a POSIX class:
  # Ansible's regex filters are Python's re, which has no [:alnum:].
  ansible.builtin.assert:
    that:
      - config_alerts_owner is defined
      - config_alerts_owner | length > 0
      - config_alerts_owner is match('^[a-z0-9][a-z0-9-]*$')
    fail_msg: >-
      config_alerts_owner must be a non-empty lowercase [a-z0-9-] identifier
      (got '{{ config_alerts_owner | default("<undefined>") }}').

- name: Require rules when installing
  # 'absent' legitimately passes no groups; 'present' with none would write an empty file and
  # silently remove this owner's entire alert coverage while reporting success.
  ansible.builtin.assert:
    that:
      - config_alerts_groups | length > 0
    fail_msg: >-
      config_alerts_state=present requires config_alerts_groups. Pass state=absent to remove
      owner '{{ config_alerts_owner }}' instead of installing an empty rule set.
  when: config_alerts_state == 'present'

- name: Set the owner's rule file path
  ansible.builtin.set_fact:
    _car_path: "{{ config_alerts_dir }}/{{ config_alerts_owner }}.yml"
    # Rendered ONCE here, not inline at each use, so the installed bytes and the validated bytes
    # are provably the same string.
    #
    # to_nice_yaml + copy(content=) is deliberate and load-bearing: Prometheus annotations use GO
    # template syntax ({{ $labels.node }}), which shares Jinja's delimiters and is a Jinja syntax
    # error. `template:` would try to render it and fail with "unexpected char '$'". Serialising a
    # data structure never re-renders the strings inside it, so Go expressions arrive verbatim.
    _car_content: |-
      # ANSIBLE MANAGED — owner: {{ config_alerts_owner }}
      #
      # Generated by roles/config_alerts from the play that deploys this entity. Do not edit here:
      # edits are overwritten on the next run and the repo becomes wrong about what is deployed.
      # Rules are owned by the play that owns the thing being alerted on, so change them there.
      #
      # This file is ONE owner's rules. Prometheus loads every *.yml in this directory
      # (rule_files: /etc/prometheus/rules/*.yml), so other files here belong to other owners and
      # are none of this owner's business. Cleanup is the owner's job: the same play removes this
      # file by calling config_alerts with state=absent.
      {{ {'groups': config_alerts_groups} | to_nice_yaml(indent=2, width=120) }}

- name: Ensure the rules directory exists
  ansible.builtin.file:
    path: "{{ config_alerts_dir }}"
    state: directory
    mode: "0755"
  when: config_alerts_state == 'present'

# --- validate BEFORE installing ---------------------------------------------------------------
# Prometheus rejects a rule file as a WHOLE on a single bad expression, so shipping an invalid file
# does not degrade coverage, it removes this owner's coverage entirely — and a reload still returns
# 200, so nothing reports a problem. Validation happens against a scratch copy so a bad file never
# reaches the rules directory even briefly.
- name: Validate the rendered rules with promtool
  when:
    - config_alerts_state == 'present'
    - config_alerts_validate | bool
  block:
    - name: Stage the candidate rules outside the rules directory
      ansible.builtin.copy:
        content: "{{ _car_content }}"
        dest: "/tmp/config-alerts-{{ config_alerts_owner }}-candidate.yml"
        mode: "0644"
      register: _car_staged
      changed_when: false

    - name: Copy the candidate into the prometheus container
      ansible.builtin.command:
        cmd: >-
          docker cp {{ _car_staged.dest }}
          {{ config_alerts_container }}:/tmp/{{ config_alerts_owner }}-candidate.yml
      changed_when: false

    - name: Run promtool over the candidate
      ansible.builtin.command:
        cmd: >-
          docker exec {{ config_alerts_container }}
          promtool check rules /tmp/{{ config_alerts_owner }}-candidate.yml
      register: _car_promtool
      changed_when: false
      failed_when: false

    - name: Fail when the rules are invalid
      # Gate on rc, never on stdout emptiness: promtool writes its diagnostics to stdout, so a
      # non-empty stdout does NOT mean success (the same trap as `dig`).
      ansible.builtin.assert:
        that:
          - _car_promtool.rc == 0
        fail_msg: >-
          promtool rejected owner '{{ config_alerts_owner }}' rules (rc={{ _car_promtool.rc }}).
          Nothing was installed. {{ _car_promtool.stdout | default('') }}
          {{ _car_promtool.stderr | default('') }}
        success_msg: "promtool accepted owner '{{ config_alerts_owner }}' rules."

  always:
    - name: Remove the candidate from the container
      ansible.builtin.command:
        cmd: >-
          docker exec {{ config_alerts_container }}
          rm -f /tmp/{{ config_alerts_owner }}-candidate.yml
      changed_when: false
      failed_when: false

    # The other half of the stage above: a scratch file created and deleted in the same run, so the
    # host ends every run exactly as it began (no candidate). Reporting `changed` here would make
    # every converge of every owner changed=1, which hides a real change behind a permanent one --
    # so, like the stage, it is not a change to the host's state.
    - name: Remove the staged candidate from the host
      ansible.builtin.file:
        path: "/tmp/config-alerts-{{ config_alerts_owner }}-candidate.yml"
        state: absent
      changed_when: false
      failed_when: false

# --- install / remove ---------------------------------------------------------------------------
- name: Install this owner's rule file
  ansible.builtin.copy:
    content: "{{ _car_content }}"
    dest: "{{ _car_path }}"
    mode: "0644"
  register: _car_installed
  when: config_alerts_state == 'present'

- name: Remove this owner's rule file
  ansible.builtin.file:
    path: "{{ _car_path }}"
    state: absent
  register: _car_removed
  when: config_alerts_state == 'absent'

# --- reload ---------------------------------------------------------------------------------
# Deliberately NOT a handler. A set_fact/notify pair that only runs at play end is read stale by
# anything later in the same run, and a caller that registers rules then immediately asserts on
# them would see the pre-reload state, and a stale reload guard produces false alerts. Reload
# inline, immediately, when something actually changed.
- name: Reload Prometheus so the change takes effect
  ansible.builtin.uri:
    url: "http://localhost:9090/-/reload"
    method: POST
    status_code: [200]
  when:
    - config_alerts_reload | bool
    - (_car_installed.changed | default(false)) or (_car_removed.changed | default(false))

- name: Confirm Prometheus loaded this owner's rules
  # A file on disk that Prometheus never read is worth nothing, and a reload returning 200 does not
  # prove the rules are in effect. Read them back from the API — the authoritative source for what
  # is actually loaded — rather than inferring success from the write.
  when:
    - config_alerts_state == 'present'
    - config_alerts_reload | bool
    - _car_installed.changed | default(false)
  block:
    - name: Ask Prometheus which rule groups it has loaded
      ansible.builtin.uri:
        url: "http://localhost:9090/api/v1/rules"
        method: GET
        return_content: true
      register: _car_loaded
      until: >-
        (_car_loaded.json.data.groups | default([])
         | selectattr('file', 'search', config_alerts_owner ~ '.yml')
         | list | length) > 0
      retries: 6
      delay: 2
      failed_when: false

    - name: Assert the rules are live
      # An explicit assert after the until: loop. A retry loop that exhausts its retries still
      # reports green on its own — `until:` with nothing checking afterwards is a silent guard.
      ansible.builtin.assert:
        that:
          - >-
            (_car_loaded.json.data.groups | default([])
             | selectattr('file', 'search', config_alerts_owner ~ '.yml')
             | list | length) > 0
        fail_msg: >-
          Prometheus did not load '{{ config_alerts_owner }}.yml' after the reload. The file was
          written and promtool accepted it, so check that {{ config_alerts_dir }} is the directory
          the container's rule_files glob actually reads.
        success_msg: >-
          Prometheus loaded
          {{ _car_loaded.json.data.groups
             | selectattr('file', 'search', config_alerts_owner ~ '.yml')
             | map(attribute='rules') | map('length') | sum }}
          rule(s) for owner '{{ config_alerts_owner }}'.
