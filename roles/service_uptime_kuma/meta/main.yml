---
galaxy_info:
  role_name: service_uptime_kuma
  namespace: richard_lynch
  author: Richard Lynch
  description: >-
    Deploy Uptime Kuma, for example as the EXTERNAL half of a dead-man watchdog: a site's
    Alertmanager pushes to a Kuma push monitor here; if the pushes stop, Kuma alerts. Binds the UI
    to loopback only by default — a fresh install has no admin account until first-run setup, so an
    unclaimed instance on a public IP can be claimed by whoever finds it first.
  license: GPL-3.0-or-later
  min_ansible_version: "2.19"
  galaxy_tags: [uptimekuma, monitoring, watchdog, docker]
