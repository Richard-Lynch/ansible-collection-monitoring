# Check/parse-mode scenario for service_uptime_kuma.
# A real target is a live host that a test run must not touch. This renders the compose file from
# sample vars and asserts the security-relevant defaults (pinned image, loopback bind).
---
dependency:
  name: galaxy
driver:
  name: default        # no container — we render/verify locally (delegated to localhost)
platforms:
  - name: localhost
provisioner:
  name: ansible
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
  playbooks:
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
