# Render the uptime-kuma compose template into a temp dir (no live host) so verify.yml can assert
# on it.
---
- name: Converge (render-only)
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../defaults/main.yml"   # load the role's generated defaults (__default vars)
  tasks:
    - name: Set only what this scenario deliberately overrides
      # Render into a temp dir instead of the real deploy path. Everything else comes from the
      # role's own resolver below.
      ansible.builtin.set_fact:
        uptime_kuma_deploy_dir: "/tmp/molecule-uptime-kuma-render"
        uptime_kuma_data_dir: "/tmp/molecule-uptime-kuma-render/data"

    - name: Resolve the rest via the role's OWN setup_vars.yml
      # INCLUDED, not mirrored. A copy of setup_vars.yml's set_fact list here would be a second
      # source of truth that drifts: add a variable to the role and the scenario fails with
      # "'<var>' is undefined", which reads as a broken ROLE and is actually a stale TEST.
      #
      # Included AFTER the overrides above because setup_vars uses `| default(...)`, so a value
      # already set wins.
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/setup_vars.yml"

    - name: Ensure render dir exists
      ansible.builtin.file:
        path: "{{ uptime_kuma_deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Render docker-compose from the role template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../files/docker-compose.yml.j2"
        dest: "{{ uptime_kuma_deploy_dir }}/docker-compose.yml"
        mode: "0644"
