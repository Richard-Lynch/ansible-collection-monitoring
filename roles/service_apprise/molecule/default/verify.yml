---
- name: Verify apprise compose
  hosts: localhost
  gather_facts: false
  vars: { render_dir: /tmp/molecule-apprise }
  tasks:
    - ansible.builtin.slurp: { src: "{{ render_dir }}/docker-compose.yml" }
      register: _c
    - ansible.builtin.set_fact: { compose: "{{ _c.content | b64decode }}" }
    - name: Pinned image, both networks, stateful mode, traefik labels
      ansible.builtin.assert:
        that:
          - "'caronc/apprise:1.2' in compose"
          - "'monitoring:' in compose"
          - "'8000:8000' in compose"
          - "'APPRISE_STATEFUL_MODE' in compose"
          - "'external: true' in compose"
        fail_msg: "apprise compose missing image / a network / stateful / traefik host."
        success_msg: "apprise OK — pinned image, monitoring+traefik nets, stateful, traefik route."
    - ansible.builtin.slurp: { src: "{{ render_dir }}/docker-compose.bound.yml" }
      register: _b
    - name: A bind address publishes ONLY on that address; empty publishes on every interface
      vars:
        _bound: "{{ _b.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'\"192.0.2.10:8000:8000\"' in _bound"
          # Near-miss: the bare mapping must be GONE when bound, or the port is still world-facing.
          - "'\"8000:8000\"' not in _bound"
          # And the default render stays the bare mapping (every interface), unchanged.
          - "'\"8000:8000\"' in compose"
          - "'192.0.2.10' not in compose"
        fail_msg: "apprise_bind_address did not control the published interface."
    - ansible.builtin.file: { path: "{{ render_dir }}", state: absent }
