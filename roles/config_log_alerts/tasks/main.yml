---
# Install (or remove) ONE owner's Loki LogQL alert rules. See meta/argument_specs.py for the
# interface and README.md for the why.

- name: Resolve declared options over their generated defaults
  # GENERATED from meta/argument_specs.py — binds every declared option to its default, so a
  # default can never be declared-but-dead (the variable evaluating Undefined at run time).
  ansible.builtin.include_tasks: _resolve_defaults.yml

- name: Validate the owner name
  # The owner becomes a filename inside the container. Without this an owner of '../chunks' would
  # write outside the tenant rule directory — into Loki's own chunk store. \w-style explicit
  # character sets are used rather than a POSIX class: Ansible's regex filters are Python's re,
  # which has no [:alnum:].
  ansible.builtin.assert:
    that:
      - config_log_alerts_owner is defined
      - config_log_alerts_owner | length > 0
      - config_log_alerts_owner is match('^[a-z0-9][a-z0-9-]*$')
    fail_msg: >-
      config_log_alerts_owner must be a non-empty lowercase [a-z0-9-] identifier
      (got '{{ config_log_alerts_owner | default("<undefined>") }}').
    quiet: true

- name: Require rules when installing
  # 'absent' legitimately passes no groups; 'present' with none would write an empty file and
  # silently remove this owner's entire log-alert coverage while reporting success.
  ansible.builtin.assert:
    that:
      - config_log_alerts_groups | length > 0
    fail_msg: >-
      config_log_alerts_state=present requires config_log_alerts_groups. Pass state=absent to
      remove owner '{{ config_log_alerts_owner }}' instead of installing an empty rule set.
    quiet: true
  when: config_log_alerts_state == 'present'

- name: Set the owner's rule file paths
  ansible.builtin.set_fact:
    # Inside the container — the ruler reads <rule_path>/<tenant>/.
    _cla_in_container: >-
      {{ config_log_alerts_rule_path }}/{{ config_log_alerts_tenant }}/{{ config_log_alerts_owner }}.yml
    # Staged on the host, outside any directory the ruler reads, so an invalid file never reaches
    # the tenant directory even briefly.
    _cla_staged: "/tmp/config-log-alerts-{{ config_log_alerts_owner }}-candidate.yml"
    # Rendered ONCE here, not inline at each use, so the installed bytes and the validated bytes
    # are provably the same string.
    #
    # to_nice_yaml + copy(content=) is deliberate and load-bearing: Loki annotations use GO
    # template syntax ({{ $labels.service_name }}), which shares Jinja's delimiters and is a Jinja
    # syntax error. `template:` would try to render it and fail with "unexpected char '$'".
    # Serialising a data structure never re-renders the strings inside it, so Go expressions
    # arrive verbatim.
    _cla_content: |-
      # ANSIBLE MANAGED — owner: {{ config_log_alerts_owner }}
      #
      # Generated by roles/config_log_alerts from the play that deploys this entity. Do not edit
      # here: this file lives on a docker volume inside the Loki container, edits are overwritten
      # on the next run, and the repo becomes wrong about what is deployed.
      # Rules are owned by the play that owns the thing being alerted on, so change them there.
      #
      # This file is ONE owner's rules. The Loki ruler loads every file in its tenant directory,
      # so other files here belong to other owners and are none of this owner's business. Cleanup
      # is the owner's job: the same play removes this file by calling config_log_alerts with
      # state=absent.
      {{ {'groups': config_log_alerts_groups} | to_nice_yaml(indent=2, width=120) }}

# --- validate BEFORE installing -----------------------------------------------------------------
# Loki ships NO rule linter (there is no promtool equivalent), so validation runs each expression
# through Loki's own query API — the authoritative parser, rather than a second implementation of
# it that could disagree. Two separate properties are checked, because they fail differently:
#
#   1. does the LogQL PARSE, and is it metric-producing?  A log-selector query returns streams,
#      not a value, and the ruler cannot compare streams to a threshold.
#   2. can the selector MATCH ANYTHING AT ALL?  A rule whose stream selector matches nothing
#      installs clean, loads, and can never fire — a silent guard.
- name: Validate this owner's LogQL before installing it
  when:
    - config_log_alerts_state == 'present'
    - config_log_alerts_validate | bool
  block:
    - name: Collect every expression in this owner's rules
      ansible.builtin.set_fact:
        _cla_exprs: >-
          {{ config_log_alerts_groups
             | map(attribute='rules') | flatten
             | map(attribute='expr') | list }}

    - name: Every rule must carry an expression
      # A rule with no `expr` is accepted by YAML and rejected by the ruler, taking the whole file
      # with it. Counting is how a missing key is caught — `map(attribute='expr')` would simply
      # yield Undefined and a downstream filter would turn that into a confident empty result.
      ansible.builtin.assert:
        that:
          - (_cla_exprs | length)
            == (config_log_alerts_groups | map(attribute='rules') | flatten | length)
          - _cla_exprs | reject('string') | list | length == 0
          - _cla_exprs | map('trim') | select('equalto', '') | list | length == 0
        fail_msg: >-
          A rule in owner '{{ config_log_alerts_owner }}' has a missing or empty `expr`.
          Nothing was installed.
        quiet: true

    - name: Ask Loki to evaluate each expression
      # An INSTANT query against the real Loki. A parse error returns 400 with the parser's own
      # message, which is a far better diagnostic than anything this role could reimplement.
      # status_code accepts the failure codes so the assert below can report WHY rather than the
      # play dying on the first bad expression with no context.
      ansible.builtin.uri:
        url: "{{ config_log_alerts_url }}/loki/api/v1/query?query={{ _cla_expr | urlencode }}"
        method: GET
        return_content: true
        status_code: [200, 400, 404, 422, 500]
      register: _cla_checked
      changed_when: false
      loop: "{{ _cla_exprs }}"
      loop_control:
        loop_var: _cla_expr
        label: "{{ _cla_expr | truncate(60) }}"

    - name: Fail when an expression does not parse
      ansible.builtin.assert:
        that:
          - _cla_checked.results | rejectattr('status', 'equalto', 200) | list | length == 0
        fail_msg: >-
          Loki rejected an expression for owner '{{ config_log_alerts_owner }}'. Nothing was
          installed.
          {{ _cla_checked.results | selectattr('status', 'ne', 200)
             | map(attribute='_cla_expr') | list }}
          ->
          {{ _cla_checked.results | selectattr('status', 'ne', 200)
             | map(attribute='content') | list }}
        quiet: true

    - name: Parse each evaluation result explicitly
      # `uri` only populates `.json` when the RESPONSE declares a JSON content-type, so
      # `content | from_json` is done by hand and asserted — otherwise "I could not read this"
      # presents as "this query returns nothing", which is exactly the verdict being tested for
      # below.
      ansible.builtin.set_fact:
        _cla_results: >-
          {{ _cla_checked.results | map(attribute='content') | map('from_json') | list }}

    - name: Every expression must be METRIC-PRODUCING
      # A bare log selector ({service_name="x"} |~ `error`) returns resultType `streams`, which the
      # ruler cannot threshold — the rule loads and never evaluates to a comparable value. Only
      # `vector`/`matrix` can drive an alert.
      ansible.builtin.assert:
        that:
          - _cla_results | rejectattr('status', 'equalto', 'success') | list | length == 0
          - >-
            _cla_results | map(attribute='data') | map(attribute='resultType')
            | reject('in', ['vector', 'matrix']) | list | length == 0
        fail_msg: >-
          An expression for owner '{{ config_log_alerts_owner }}' is not metric-producing —
          it returns {{ _cla_results | map(attribute='data')
                         | map(attribute='resultType') | list }}, and the ruler can only
          threshold a vector or matrix. Wrap the selector in an aggregation, e.g.
          sum(count_over_time({...}[5m])). Nothing was installed.
        quiet: true

    - name: Each rule's selector must be capable of matching something
      # THE SILENT-GUARD CHECK. An expression can parse, be metric-producing, and still match no
      # stream whatsoever — in which case the rule can never fire and the alerting coverage it
      # appears to provide is imaginary. Loki returns an EMPTY result for that, which is
      # indistinguishable from "the condition is currently false" on a single instant query.
      #
      # So the probe asks the OPPOSITE question: strip the rule's threshold and ask whether the
      # selector has produced ANY data over a long window. A non-empty answer proves the stream
      # exists and the labels are right; an empty one means the selector is wrong (very often the
      # {hostname=} / {service_name=} label-scheme trap) or the stream is gone.
      when: config_log_alerts_verify_matches | bool
      block:
        - name: Extract the stream selector (plus any line filters) from each expression
          # Done as its own step so the probe query is VISIBLE in the transcript. Building it
          # inline inside the uri url made a malformed probe present as an unparseable response,
          # i.e. as "this selector matches nothing" — the exact misread this check exists to stop.
          #
          # The pattern takes everything from the opening brace through the closing brace, plus any
          # `|=`/`|~` line filters that follow, and stops before the `[range]`. The range is then
          # appended as a fixed 24h window: the rule's own 5m/10m range is far too short to prove a
          # selector CAN match — a correct rule for a rare event would read as broken.
          ansible.builtin.set_fact:
            _cla_probes: >-
              {{ _cla_exprs
                 | map('regex_search', '\{[^}]*\}(\s*\|[^[]*?)?(?=\s*\[)')
                 | list }}

        - name: Every expression must contain a recognisable stream selector
          # If the extraction failed, the probe below would query nonsense and report zero matches
          # — "I could not parse your rule" presenting as "your rule can never fire". Fail on the
          # extraction instead, with a message that says which expression could not be read.
          ansible.builtin.assert:
            that:
              - _cla_probes | select('none') | list | length == 0
              - _cla_probes | map('trim') | select('equalto', '') | list | length == 0
            fail_msg: >-
              Could not extract a stream selector from an expression for owner
              '{{ config_log_alerts_owner }}', so its selector could not be validated. Expected a
              `{label="value"}` selector followed by a `[range]`. Expressions:
              {{ _cla_exprs | zip(_cla_probes) | list }}
            quiet: true

        - name: Count what each rule's selector has seen over 24h
          ansible.builtin.uri:
            url: >-
              {{ config_log_alerts_url }}/loki/api/v1/query?query={{
                 ('sum(count_over_time(' ~ _cla_probe.0 ~ '[24h]))') | urlencode }}
            method: GET
            return_content: true
            status_code: [200, 400]
          register: _cla_seen
          changed_when: false
          loop: "{{ _cla_probes | zip(_cla_exprs) | list }}"
          loop_control:
            loop_var: _cla_probe
            label: "{{ _cla_probe.0 | truncate(60) }}"

        - name: Every selector probe must have returned a usable answer
          # Gated BEFORE the counts are read, so a 400 or an empty body can never be counted as
          # "zero matches". Without this the next task's from_json raises mid-template, which
          # reports as a broken role rather than as a failed probe.
          ansible.builtin.assert:
            that:
              - _cla_seen.results | rejectattr('status', 'equalto', 200) | list | length == 0
              - >-
                _cla_seen.results | map(attribute='content')
                | map('default', '', true) | map('trim')
                | select('equalto', '') | list | length == 0
            fail_msg: >-
              A selector probe for owner '{{ config_log_alerts_owner }}' did not return a usable
              response, so no selector below has been validated. Nothing was installed.
              {{ _cla_seen.results
                 | rejectattr('status', 'equalto', 200)
                 | map(attribute='content') | map('default', '(empty body)', true) | list }}
            quiet: true

        - name: Report what each selector matched
          # Printed, not just asserted: a count of 0 against a 24h window is the finding, and it
          # must be visible in the transcript rather than only in a failure message.
          ansible.builtin.debug:
            msg: >-
              {{ _cla_item.0.0 | truncate(70) }}
              -> matched {{
                   ((_cla_item.1.content | from_json).data.result | default([])
                    | map(attribute='value') | map('last') | list) | default(['0'], true)
                 }} lines/24h
          loop: "{{ (_cla_probes | zip(_cla_exprs) | list) | zip(_cla_seen.results) | list }}"
          loop_control:
            loop_var: _cla_item
            label: "{{ _cla_item.0.0 | truncate(50) }}"

        - name: HARD GATE — no rule may ship with a selector that matches nothing
          vars:
            _cla_empty: >-
              {{ _cla_seen.results
                 | map(attribute='content') | map('from_json')
                 | map(attribute='data') | map(attribute='result')
                 | select('equalto', []) | list }}
          ansible.builtin.assert:
            that:
              - (_cla_empty | length) == 0
            fail_msg: >-
              {{ _cla_empty | length }} rule(s) for owner '{{ config_log_alerts_owner }}' have a
              stream selector that matched NOTHING over 24 hours, so they could never fire.
              Nothing was installed. The usual cause is the label scheme: journal streams may be
              {hostname="X"} while container streams are
              {instance="X", service_name="Y", platform="docker"} — a hostname selector returns
              zero against a container. Enumerate the real streams (/loki/api/v1/series), or pass
              config_log_alerts_verify_matches=false at the call site WITH a reason if the stream
              genuinely does not exist yet.
            success_msg: >-
              Every selector for owner '{{ config_log_alerts_owner }}' matches live data.
            quiet: true

# --- install / remove ---------------------------------------------------------------------------
# The tenant rule directory is INSIDE the container on a docker volume, not a host bind mount, so
# the file is staged on the host and copied in with `docker cp`. config_alerts can use a plain
# `copy:` because Prometheus's rules directory IS bind-mounted; Loki's is not.
- name: Install this owner's rule file
  when: config_log_alerts_state == 'present'
  block:
    - name: Stage the rule file on the host
      # changed_when: false — this is a SCRATCH file in /tmp that the `always` block deletes at the
      # end of this block. Writing and deleting a temp file is not a change to the host, and
      # letting it report `changed` would make a fully converged run show changed=2 forever: the
      # staging write and its own cleanup. A changed count that is never zero is a dishonest one,
      # and it trains everyone to ignore changed counts.
      #
      # The authoritative `changed` for this role is the `docker cp` below, which compares the
      # bytes already in the container against the rendered content.
      #
      # OWNED BY 10001:10001 ON THE HOST, because `docker cp` preserves ownership and the ruler
      # needs to WRITE the file (it maps/rewrites rule files on every sync — see the gate below).
      # Chowning after the copy is not an option: `docker exec <c> chown` fails with "Operation
      # not permitted", since docker exec runs as the image's own unprivileged user. Setting it
      # here, before the copy, is the only point at which it can be done.
      #
      # The numeric uid is used rather than a name: 10001 does not exist in the HOST's passwd
      # database (it is the container's `loki` user), so `owner: loki` would fail to resolve.
      ansible.builtin.copy:
        content: "{{ _cla_content }}"
        dest: "{{ _cla_staged }}"
        mode: "0644"
        owner: "10001"
        group: "10001"
      register: _cla_stage
      changed_when: false

    - name: Read the rule file the container currently has
      # The idempotence read-back. `docker cp` always writes, so copying unconditionally would
      # report `changed` on every run and restart the ruler for nothing — a dishonest changed_when
      # is the same defect as a silent guard, arriving from the other side. Comparing
      # content first is what makes this role safe to run twice.
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ config_log_alerts_container }}"
          - cat
          - "{{ _cla_in_container }}"
      register: _cla_existing
      changed_when: false
      failed_when: false

    - name: Copy the rule file into the ruler's tenant directory
      # `--archive` (-a) is what makes `docker cp` PRESERVE the staged file's uid/gid. Without it
      # docker cp chowns the destination to the container's root, and the ruler — which must
      # WRITE the file — is left with a file it can only read, which it rejects once a minute
      # with 'unable to map rule files: permission denied'. See the gate below.
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - --archive
          - "{{ _cla_staged }}"
          - "{{ config_log_alerts_container }}:{{ _cla_in_container }}"
      # Honest: changed only when the bytes actually differ from what is already there. The
      # staged file ends with a newline that `cat` preserves, so both sides are compared trimmed.
      changed_when: (_cla_existing.stdout | default('') | trim) != (_cla_content | trim)
      register: _cla_copied

    - name: Confirm the ruler can OPEN the file for writing, not merely read it
      # THE RULER NEEDS WRITE ACCESS, not read access. This is the single most counter-intuitive
      # thing about installing Loki rules. A read-only file produces, once a minute:
      #
      #   caller=mapper.go:163 msg="updating rule file" file=/loki/rules/fake/roundtrip-probe.yml
      #   caller=manager.go:139 msg="unable to map rule files" user=fake
      #       err="open /loki/rules/fake/roundtrip-probe.yml: permission denied"
      #
      # Loki's ruler MAPS rule files — it rewrites them into its own working layout on every
      # sync — so a file it can read but not write is rejected, once per minute, forever. And the
      # rejection is per-FILE: the other owners' rules keep evaluating perfectly while this one
      # never appears in /prometheus/api/v1/rules at all. So the symptom is "my rule is not
      # there", with the explanation only in the container log.
      #
      # `test -r` would be the wrong gate: `docker cp` preserves the staged 0644 mode, so the
      # ruler CAN read the file — true and irrelevant, since it passes on a file the ruler rejects
      # every minute. A guard that checks the wrong permission is a silent guard: it reports
      # health while the thing it guards is broken.
      #
      # `test -w` is the property that actually matters, so that is what is checked.
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ config_log_alerts_container }}"
          - test
          - -w
          - "{{ _cla_in_container }}"
      register: _cla_writable
      changed_when: false
      failed_when: false

    - name: HARD GATE — a rule file the ruler cannot WRITE is silently rejected
      ansible.builtin.assert:
        that:
          - _cla_writable.rc == 0
        fail_msg: >-
          {{ _cla_in_container }} is not WRITABLE by the uid Loki runs as (10001). The ruler maps
          (rewrites) rule files on every sync, so it will log
          'unable to map rule files: permission denied' once a minute and this owner's rules will
          never appear in /prometheus/api/v1/rules — while every other owner keeps working, so
          the symptom is "my rule is missing" with no visible error.
          The staged file is chowned to 10001:10001 before `docker cp`, which preserves ownership;
          check that task. Note `docker exec <c> chown` CANNOT fix it after the fact — docker exec
          runs as the image's own unprivileged user.
        quiet: true

  always:
    - name: Remove the staged candidate from the host
      # changed_when: false for the same reason as the staging write — deleting the scratch file
      # this role just created is not a change to the host, and reporting it as one would make a
      # converged run show changed=2 permanently.
      ansible.builtin.file:
        path: "{{ _cla_staged }}"
        state: absent
      failed_when: false
      changed_when: false

- name: Remove this owner's rule file
  when: config_log_alerts_state == 'absent'
  block:
    - name: Check whether this owner has a rule file at all
      # So the removal reports honestly: `rm -f` always succeeds, and without this the role would
      # claim a change on every run against an owner that was already gone.
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ config_log_alerts_container }}"
          - test
          - -f
          - "{{ _cla_in_container }}"
      register: _cla_present
      changed_when: false
      failed_when: false

    - name: Remove the rule file from the tenant directory
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ config_log_alerts_container }}"
          - rm
          - -f
          - "{{ _cla_in_container }}"
      changed_when: _cla_present.rc == 0
      register: _cla_removed
      when: _cla_present.rc == 0

    # DELETING THE FILE IS NOT ENOUGH, and the fix is a RESTART rather than an API call.
    #
    # Each obvious alternative fails:
    #   1. after the file is removed, the ruler goes on EVALUATING the group, with
    #      `lastEvaluation` ADVANCING rather than frozen.
    #   2. no copy of the file exists anywhere under the rule path: the group lives purely in the
    #      ruler's in-memory rule manager, which does not drop a group when its file disappears.
    #   3. the ruler's own DELETE /loki/api/v1/rules/<namespace>/<group> — the documented way to
    #      remove a group from a running ruler — answers **HTTP 500**:
    #
    #        {"status":"error","errorType":"server_error",
    #         "error":"DeleteRuleGroup unsupported in rule local store"}
    #
    #      i.e. the write half of the ruler API is NOT IMPLEMENTED for `storage.type: local`, so
    #      `enable_api` is read-only in practice with local rule storage.
    #
    # That leaves restarting the container, which re-reads the tenant directory from scratch and
    # so drops any group whose file is gone. It is a real cost — a restart briefly interrupts log
    # INGEST, not just alerting — so it is gated behind an explicit option rather than done
    # silently on every removal, and the default is to tell the operator instead.
    - name: Is this owner still LOADED in the running ruler?
      # Gated on the RULER's state, not on whether the file was just deleted. An owner whose file
      # was already gone — a previous run that removed the file without restarting, or a
      # hand-deleted file — still has a live group, and keying the restart on `_cla_present.rc`
      # would skip every task and report a clean removal for a rule that is still firing.
      ansible.builtin.uri:
        url: "{{ config_log_alerts_url }}/prometheus/api/v1/rules"
        method: GET
        return_content: true
        status_code: [200, 404, 503]
      register: _cla_still_loaded
      changed_when: false
      failed_when: false

    - name: Record whether the ruler still holds this owner
      ansible.builtin.set_fact:
        _cla_group_live: >-
          {{ ((_cla_still_loaded.content | default('{}', true) | from_json).data.groups
              | default([]) | map(attribute='file') | list
              | select('search', config_log_alerts_owner ~ '.yml')
              | list | length) > 0 }}

    - name: Restart Loki so the removed group leaves the running ruler
      when:
        - _cla_group_live | bool
        - config_log_alerts_restart_on_remove | bool
      # Through COMPOSE, not `docker_container`. `docker_container` with restart:true RECREATES
      # the container outside compose's knowledge, which leaves it detached from the compose
      # project: after such a restart the ruler can come back answering HTTP 400 for a missing
      # tenant directory, needing a full re-converge through service_loki to recover. `docker_compose_v2` restarts the service as the project defines
      # it, preserving the volume and config mounts.
      community.docker.docker_compose_v2:
        project_src: "{{ config_log_alerts_compose_dir }}"
        state: restarted
      register: _cla_restarted

    - name: Confirm the group is gone from the RUNNING ruler
      when:
        - _cla_group_live | bool
        - config_log_alerts_restart_on_remove | bool
      block:
        - name: Ask the ruler which groups it is evaluating now
          ansible.builtin.uri:
            url: "{{ config_log_alerts_url }}/prometheus/api/v1/rules"
            method: GET
            return_content: true
            status_code: [200, 404, 503]
          register: _cla_after_restart
          until: >-
            _cla_after_restart.status in [200, 404]
            and ((_cla_after_restart.content | default('{}', true) | from_json).data.groups
                 | default([]) | map(attribute='file') | list
                 | select('search', config_log_alerts_owner ~ '.yml')
                 | list | length) == 0
          retries: 24
          delay: 5
          changed_when: false
          failed_when: false

        - name: HARD GATE — the removed owner must no longer be evaluated
          # An explicit assert after the until: loop, which reports green on exhausting its
          # retries.
          ansible.builtin.assert:
            that:
              - _cla_after_restart.status in [200, 404]
              - >-
                ((_cla_after_restart.content | default('{}', true) | from_json).data.groups
                 | default([]) | map(attribute='file') | list
                 | select('search', config_log_alerts_owner ~ '.yml')
                 | list | length) == 0
            fail_msg: >-
              The ruler is still evaluating owner '{{ config_log_alerts_owner }}' after a restart,
              although its rule file is gone. Check the tenant directory for another file naming
              the same group.
            success_msg: >-
              Owner '{{ config_log_alerts_owner }}' is gone from the running ruler. Alertmanager
              resolves anything it was firing after its own resolve_timeout.
            quiet: true

    - name: Warn that the group is still live in the ruler
      # The honest alternative to a silent half-removal. Without the restart the file is gone and
      # the rule KEEPS FIRING, which for a retired service is alert-channel noise that nobody can
      # explain from the source — so say so plainly rather than reporting a clean removal.
      when:
        - _cla_group_live | bool
        - not (config_log_alerts_restart_on_remove | bool)
      ansible.builtin.debug:
        msg: >-
          REMOVED THE FILE ONLY. Owner '{{ config_log_alerts_owner }}' is still loaded in the
          running ruler and its rules will KEEP FIRING: Loki's ruler does not drop an in-memory
          group when its file disappears, and DELETE on the ruler API is unsupported for
          `storage.type: local` ("DeleteRuleGroup unsupported in rule local store"). Re-run with
          config_log_alerts_restart_on_remove=true to restart Loki and clear it, bearing in mind
          a restart briefly interrupts log INGEST for every host.

# --- make the ruler re-read, then prove it did --------------------------------------------------
# Loki's ruler polls its rule directory, but the poll interval is not something to wait out blindly
# — and no reload endpoint exists for the ruler in single-binary mode. The read-back below is what
# establishes the rules are live, with retries covering the poll.
- name: Confirm the ruler loaded this owner's rules
  # Deliberately NOT a handler. A handler runs at play end, so anything later in the same run reads
  # the pre-reload state, and a guard reading stale state produces false alerts. Verify inline,
  # immediately.
  #
  # Runs on EVERY converged run, not only when something changed. config_alerts gates its
  # equivalent on `_car_installed.changed`, which is right for Prometheus — a reload is only
  # needed after a write. Here the question is different: the rule file lives on a docker volume
  # inside a container that can be recreated, restarted or rolled back by anything else on the
  # host, so "nothing changed this run" does NOT imply "the ruler still has these rules". Checking
  # unconditionally is what makes a converged run evidence rather than an assumption, and it costs
  # one GET.
  when: config_log_alerts_state == 'present'
  block:
    - name: Ask the ruler which rule groups it has loaded
      ansible.builtin.uri:
        url: "{{ config_log_alerts_url }}/loki/api/v1/rules"
        method: GET
        return_content: true
        status_code: [200, 404, 400]
      register: _cla_loaded
      # The rules endpoint serves YAML, so this matches on the response TEXT rather than reading
      # `.json` — which `uri` never populates for a non-JSON content-type, and whose absence would
      # present as "the ruler loaded nothing".
      # `| default('', true)` rather than `| default('')`: a restarting Loki answers with an EMPTY
      # body, and the non-boolean form passes '' straight through to the `in` test, which is fine
      # — but a body that is absent entirely (connection refused mid-restart) leaves `content`
      # undefined, and the boolean form is what keeps the expression total instead of raising
      # inside the until:, which Ansible reports as a hard failure of the loop rather than a retry.
      until: >-
        _cla_loaded.status == 200
        and (config_log_alerts_owner ~ '.yml') in (_cla_loaded.content | default('', true))
      retries: 12
      delay: 5
      changed_when: false
      failed_when: false

    - name: HARD GATE — the rules must be live in the ruler
      # An explicit assert AFTER the until: loop. A retry loop that exhausts its retries still
      # reports green on its own, so `until:` with nothing checking afterwards is a silent guard.
      ansible.builtin.assert:
        that:
          - _cla_loaded.status == 200
          - (config_log_alerts_owner ~ '.yml') in (_cla_loaded.content | default(''))
        fail_msg: >-
          The Loki ruler did not load '{{ config_log_alerts_owner }}.yml' (HTTP
          {{ _cla_loaded.status }}). The file was written to {{ _cla_in_container }} and its LogQL
          was accepted by Loki, so check that the ruler's rule_path and tenant match
          service_loki's loki__rule_path / loki_ruler_tenant, and that the file is owned by uid
          10001. Body: {{ _cla_loaded.content | default('') | trim | truncate(400) }}
        success_msg: >-
          The ruler has loaded owner '{{ config_log_alerts_owner }}' — log alerting is live for it.
        quiet: true
