---
- name: Converge — render grafana compose + env (no docker)
  hosts: localhost
  gather_facts: false
  vars:
    grafana_container_name: grafana
    grafana_image_version: "12.1.1"
    grafana_host_port: 3000
    grafana_admin_user: admin
    grafana_admin_password: "TESTPW"
    grafana_server_root_url: "%(protocol)s://%(domain)s/"
    grafana_network: monitoring
    grafana_db_host: postgres
    grafana_db_port: 5432
    grafana_db_name: grafana
    grafana_db_user: grafana
    grafana_db_password: "TESTDBPW"
    grafana_config_dir: /opt/grafana
    grafana_data_volume: grafana-data
    render_dir: /tmp/molecule-grafana
  tasks:
    - ansible.builtin.file: { path: "{{ render_dir }}", state: directory, mode: "0755" }
    - ansible.builtin.template:
        src: "{{ playbook_dir }}/../../files/docker-compose.yml.j2"
        dest: "{{ render_dir }}/docker-compose.yml"
        mode: "0644"
    - ansible.builtin.template:
        src: "{{ playbook_dir }}/../../files/grafana.env.j2"
        dest: "{{ render_dir }}/grafana.env"
        mode: "0644"
    - ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../files/provisioning/datasources/datasources.yml"
        dest: "{{ render_dir }}/datasources.yml"
        mode: "0644"
    - ansible.builtin.template:
        src: "{{ playbook_dir }}/../../files/provisioning/dashboards/dashboards.yml.j2"
        dest: "{{ render_dir }}/dashboards.yml"
        mode: "0644"
      vars:
        grafana_dashboards_folder: Observability
