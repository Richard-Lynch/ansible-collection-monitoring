# Offline scenario — exercises the role's REAL rendering and guard logic with no Prometheus.
# config_metrics_dir points at a temp dir and verify is off (it needs the API), so nothing real is
# touched.
---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: localhost
provisioner:
  name: ansible
  # Molecule runs from the scenario directory, so a project ansible.cfg roles_path does not
  # resolve. Pointed at the roles directory so converge.yml can include_role the role under test —
  # which is what makes this a real test of the role's own code rather than a re-derivation.
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
    # BOTH trees: the installed dependencies (collections.galaxy/) and the tree holding this
    # role's own collection. Molecule does not inherit ansible.cfg, and a dev venv that bundles
    # the collections in site-packages would hide the omission.
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../collections.galaxy:${MOLECULE_PROJECT_DIRECTORY}/../../../../.."
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
  playbooks:
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # No idempotence step: converge deliberately provokes the role's guards and catches them with
  # block/rescue, so a second converge re-raises by design. Re-registering an unchanged owner is a
  # plain `copy`, idempotent by construction, and verify asserts the written files directly.
  test_sequence: [syntax, converge, verify]
