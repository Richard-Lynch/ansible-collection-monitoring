---
# Register (or remove) ONE owner's full Prometheus scrape JOB.
#
# For targets a file_sd entry cannot express. file_sd is only {targets, labels}: no per-target
# auth, no per-target interval, no metric_relabel_configs. Home Assistant needs all three — a
# bearer token, a 60s interval because the endpoint returns thousands of series rendered synchronously in
# HA's event loop, and drops for the metrics that are pure cost.
#
# Pulled in by prometheus.yml's `scrape_config_files`, which needs Prometheus >= 2.43. See
# meta/argument_specs.py for the interface and README.md for the why.

- name: Resolve declared options over their generated defaults
  ansible.builtin.include_tasks: _resolve_defaults.yml

- name: Enforce the constraints Ansible's argspec validator cannot
  ansible.builtin.include_tasks: _argspec_guards.yml

- name: Validate the owner name
  # The owner becomes a filename, so '../prometheus' would write outside the directory.
  ansible.builtin.assert:
    that:
      - config_metrics_owner is defined
      - config_metrics_owner | length > 0
      - config_metrics_owner is match('^[a-z0-9][a-z0-9-]*$')
    fail_msg: >-
      config_metrics_owner must be a non-empty lowercase [a-z0-9-] identifier
      (got '{{ config_metrics_owner | default("<undefined>") }}').

- name: Require a job when registering
  # 'absent' legitimately passes none; 'present' with none would write a file declaring no jobs and
  # silently stop this target being scraped while reporting success.
  ansible.builtin.assert:
    that:
      - config_metrics_job | length > 0
      - config_metrics_job.job_name is defined
      - config_metrics_job.job_name | length > 0
    fail_msg: >-
      config_metrics_state=present requires config_metrics_job with a job_name. Pass state=absent
      to stop scraping owner '{{ config_metrics_owner }}' instead of installing an empty job.
  when: config_metrics_state == 'present'

- name: Set the owner's scrape-job path
  ansible.builtin.set_fact:
    _cmj_path: "{{ config_metrics_job_dir }}/{{ config_metrics_owner }}.yml"

- name: Compose the job, injecting the credential if one was given
  # Kept OUT of config_metrics_job so the caller never has to put a credential in a plain dict that
  # might be echoed by a debug task. combine() rather than editing in place, so a caller that
  # supplies its own auth block is not silently overridden by an empty one. Separate file so
  # molecule can exercise exactly this composition.
  ansible.builtin.include_tasks: _compose_job.yml
  when: config_metrics_state == 'present'

- name: Render the scrape-job file
  ansible.builtin.set_fact:
    # A MAPPING with a `scrape_configs:` key. A bare list is rejected by Prometheus with
    # "cannot unmarshal !!seq into config.ScrapeConfigs".
    #
    # to_nice_yaml + copy(content=), not `template:`: a job can carry regexes and label values with
    # braces, and serialising a data structure cannot re-render them. Same reasoning as
    # config_alerts, where it is load-bearing for Go templating.
    _cmj_content: |-
      # ANSIBLE MANAGED — owner: {{ config_metrics_owner }}
      #
      # Generated by roles/config_metrics (entrypoint: scrape_job) from the play that deploys this
      # entity. Do not edit here: edits are overwritten on the next run and the repo becomes wrong
      # about what is deployed.
      #
      # A full scrape job rather than a file_sd entry, because this target needs something file_sd
      # cannot express (per-target auth, interval, or metric_relabel_configs). Pulled in by
      # prometheus.yml's scrape_config_files.
      {{ {'scrape_configs': [_cmj_job]} | to_nice_yaml(indent=2, width=120) }}
  no_log: true
  when: config_metrics_state == 'present'

- name: Ensure the scrape-job directory exists
  ansible.builtin.file:
    path: "{{ config_metrics_job_dir }}"
    state: directory
    owner: root
    group: "{{ config_metrics_job_group }}"
    # 0750: the container must traverse it to read a 0640 job file, but it need not be world-listable.
    mode: "0750"
  when: config_metrics_state == 'present'

# --- validate BEFORE installing -----------------------------------------------------------------
# Prometheus fails its WHOLE config load on one bad scrape_config_files entry, so a broken job here
# does not degrade this target's coverage — it stops the entire server reloading, taking every
# other job with it. Validated against a scratch copy so a bad file is never loadable even briefly.
- name: Validate the rendered job with promtool
  when:
    - config_metrics_state == 'present'
    - config_metrics_verify | bool
  block:
    - name: Stage the candidate outside the scrape-job directory
      ansible.builtin.copy:
        content: "{{ _cmj_content }}"
        dest: "/tmp/config-metrics-{{ config_metrics_owner }}-job.yml"
        mode: "0600"
      no_log: true
      changed_when: false

    - name: Wrap it in a minimal config and check it
      # argv, not a folded `cmd:` string — folding eats the quotes holding an `sh -c` script
      # together, and the checker then validates an EMPTY wrapper and returns 0 without reading the
      # candidate at all.
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ config_metrics_container | default('prometheus') }}"
          - sh
          - -c
          - >-
            d=/tmp/cmj-{{ config_metrics_owner }};
            mkdir -p $d;
            cp /tmp/config-metrics-{{ config_metrics_owner }}-job.yml $d/job.yml;
            printf 'global:\n  scrape_interval: 15s\nscrape_config_files:\n  - %s/*.yml\n' "$d" > $d.main.yml;
            promtool check config $d.main.yml;
            rc=$?;
            rm -rf $d $d.main.yml;
            exit $rc
      register: _cmj_check
      changed_when: false
      failed_when: false

    - name: Fail when the job is not valid
      # Gate on rc, never on stdout emptiness: promtool writes its diagnostics to stdout.
      ansible.builtin.assert:
        that:
          - _cmj_check.rc == 0
        fail_msg: >-
          promtool rejected the scrape job for owner '{{ config_metrics_owner }}'
          (rc={{ _cmj_check.rc }}). Nothing was installed. {{ _cmj_check.stdout | default('') }}
        success_msg: "promtool accepted the scrape job for owner '{{ config_metrics_owner }}'."

  always:
    - name: Remove the staged candidate
      ansible.builtin.file:
        path: "/tmp/config-metrics-{{ config_metrics_owner }}-job.yml"
        state: absent
      failed_when: false

# --- install / remove ---------------------------------------------------------------------------
- name: Install this owner's scrape job
  ansible.builtin.copy:
    content: "{{ _cmj_content }}"
    dest: "{{ _cmj_path }}"
    # 0640 root:nobody, NOT 0600 root. The job may carry a bearer token so it must not be
    # world-readable like the other config files (0644) — but the Prometheus container runs as
    # nobody(65534), and 0600 root makes it unreadable: the reload returns HTTP 500 with
    # "open /etc/prometheus/scrape_jobs/<owner>.yml: permission denied" and the whole config is
    # rejected, taking every other job with it.
    #
    # Group-readable by the container's own uid is the narrowest permission that works.
    owner: root
    group: "{{ config_metrics_job_group }}"
    mode: "0640"
  no_log: true
  register: _cmj_installed
  when: config_metrics_state == 'present'

- name: Remove this owner's scrape job
  ansible.builtin.file:
    path: "{{ _cmj_path }}"
    state: absent
  register: _cmj_removed
  when: config_metrics_state == 'absent'

# --- reload and prove it took effect ------------------------------------------------------------
# Unlike file_sd, scrape_config_files are read at config load — a new job sits inert until
# Prometheus reloads. Reloaded inline rather than via a handler: a handler runs at play end, so
# anything later in the same run reads the pre-reload state.
- name: Reload Prometheus so the job takes effect
  ansible.builtin.uri:
    url: "http://localhost:9090/-/reload"
    method: POST
    status_code: [200]
  when:
    - config_metrics_verify | bool
    - (_cmj_installed.changed | default(false)) or (_cmj_removed.changed | default(false))

- name: Confirm Prometheus is scraping this owner's job
  when:
    - config_metrics_state == 'present'
    - config_metrics_verify | bool
    - _cmj_installed.changed | default(false)
  block:
    - name: Ask Prometheus which targets it has discovered
      ansible.builtin.uri:
        url: "http://localhost:9090/api/v1/targets"
        method: GET
        return_content: true
      register: _cmj_api
      until: >-
        _cmj_api.json.data.activeTargets | default([])
        | selectattr('labels.job', 'equalto', config_metrics_job.job_name) | list | length > 0
      retries: "{{ config_metrics_verify_retries | int }}"
      delay: 5
      failed_when: false

    - name: Read back what is actually being scraped
      # Recomputed from the last response rather than trusting the until: loop's own exit — a retry
      # loop that exhausts its retries still reports the task green on its own.
      ansible.builtin.set_fact:
        _cmj_live: >-
          {{ _cmj_api.json.data.activeTargets | default([])
             | selectattr('labels.job', 'equalto', config_metrics_job.job_name) | list }}

    - name: Assert the job is live
      ansible.builtin.assert:
        that:
          - _cmj_live | length > 0
        fail_msg: >-
          Prometheus has no targets for job '{{ config_metrics_job.job_name }}' after
          {{ (config_metrics_verify_retries | int) * 5 }}s. The file was written and promtool
          accepted it, so check that prometheus.yml lists {{ config_metrics_job_dir }} in
          scrape_config_files and that the reload succeeded.
        success_msg: >-
          Prometheus is scraping {{ _cmj_live | length }} target(s) for job
          '{{ config_metrics_job.job_name }}'
          (health: {{ _cmj_live | map(attribute='health') | unique | join(', ') }}).
