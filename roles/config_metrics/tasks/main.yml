---
# Register (or remove) ONE owner's Prometheus scrape targets. See meta/argument_specs.py for the
# interface and README.md for the why.

- name: Resolve declared options over their generated defaults
  # GENERATED from meta/argument_specs.py — binds every declared option to its default, so a
  # default can never be declared-but-dead (the variable evaluating Undefined at run time).
  ansible.builtin.include_tasks: _resolve_defaults.yml

- name: Enforce the constraints Ansible's argspec validator cannot
  ansible.builtin.include_tasks: _argspec_guards.yml

- name: Validate the owner name
  # The owner becomes a filename. Without this an owner of '../prometheus' would write outside the
  # file_sd directory. \w-style character sets rather than a POSIX class: Ansible's regex filters
  # are Python's re, which has no [:alnum:].
  ansible.builtin.assert:
    that:
      - config_metrics_owner is defined
      - config_metrics_owner | length > 0
      - config_metrics_owner is match('^[a-z0-9][a-z0-9-]*$')
    fail_msg: >-
      config_metrics_owner must be a non-empty lowercase [a-z0-9-] identifier
      (got '{{ config_metrics_owner | default("<undefined>") }}').

- name: Require targets when registering
  # 'absent' legitimately passes none; 'present' with none would write an empty file and silently
  # stop this owner's exporters being scraped while reporting success.
  ansible.builtin.assert:
    that:
      - config_metrics_targets | length > 0
    fail_msg: >-
      config_metrics_state=present requires config_metrics_targets. Pass state=absent to stop
      scraping owner '{{ config_metrics_owner }}' instead of registering an empty target set.
  when: config_metrics_state == 'present'

- name: Check every entry actually declares targets
  # A file_sd entry with no `targets` key is accepted by Prometheus and scrapes NOTHING — it is
  # valid YAML and valid file_sd, so neither the write nor a syntax check would complain. The only
  # symptom is a missing exporter, which is indistinguishable from one that is simply down.
  ansible.builtin.assert:
    that:
      - config_metrics_targets | rejectattr('targets', 'defined') | list | length == 0
      - config_metrics_targets | selectattr('targets', 'defined') | map(attribute='targets') | select('equalto', []) | list | length == 0
    fail_msg: >-
      Every entry in config_metrics_targets needs a non-empty `targets` list. Entries without one
      are valid file_sd that scrapes nothing, so the failure is invisible.
  when: config_metrics_state == 'present'

- name: Set the owner's file_sd path
  ansible.builtin.set_fact:
    _cm_path: "{{ config_metrics_dir }}/{{ config_metrics_owner }}.yml"
    # Rendered ONCE here so the written bytes and any later check are provably the same string.
    # to_nice_yaml + copy(content=) rather than `template:`: nothing in a target definition needs
    # Jinja, and serialising a data structure cannot mangle a label value that happens to contain
    # braces. Same reasoning as config_alerts, where it is load-bearing for Go templating.
    _cm_content: |-
      # ANSIBLE MANAGED — owner: {{ config_metrics_owner }}
      #
      # Generated by roles/config_metrics from the play that deploys this entity. Do not edit here:
      # edits are overwritten on the next run and the repo becomes wrong about what is deployed.
      #
      # This file is ONE owner's scrape targets. Prometheus loads every *.yml in this directory
      # (file_sd_configs, refresh_interval 30s), so other files here belong to other owners.
      # Cleanup is the owner's job: the same play removes this file with state=absent.
      {{ config_metrics_targets | to_nice_yaml(indent=2, width=120) }}

- name: Ensure the file_sd directory exists
  ansible.builtin.file:
    path: "{{ config_metrics_dir }}"
    state: directory
    mode: "0755"
  when: config_metrics_state == 'present'

- name: Register this owner's scrape targets
  ansible.builtin.copy:
    content: "{{ _cm_content }}"
    dest: "{{ _cm_path }}"
    mode: "0644"
  register: _cm_written
  when: config_metrics_state == 'present'

- name: Stop scraping this owner's targets
  ansible.builtin.file:
    path: "{{ _cm_path }}"
    state: absent
  register: _cm_removed
  when: config_metrics_state == 'absent'

# --- read back from Prometheus itself -----------------------------------------------------------
# No reload is needed (file_sd is polled on a refresh_interval), but "no reload needed" is exactly
# what makes this silent: a malformed or misplaced file produces no error the caller can see, and
# the targets simply never appear while the stack looks healthy.
- name: Confirm Prometheus is scraping this owner's targets
  when:
    - config_metrics_state == 'present'
    - config_metrics_verify | bool
    - _cm_written.changed | default(false)
  block:
    - name: Collect the addresses this owner just registered
      ansible.builtin.set_fact:
        _cm_want: "{{ config_metrics_targets | map(attribute='targets') | flatten | unique | sort }}"

    - name: Ask Prometheus which targets it has discovered
      ansible.builtin.uri:
        url: "http://localhost:9090/api/v1/targets"
        method: GET
        return_content: true
      register: _cm_api
      until: >-
        _cm_want | difference(
          _cm_api.json.data.activeTargets | default([])
          | map(attribute='discoveredLabels') | map(attribute='__address__') | list
        ) | length == 0
      retries: "{{ config_metrics_verify_retries | int }}"
      delay: 5
      failed_when: false

    - name: Work out what is still missing
      # Computed from a fresh read of the LAST response rather than trusting the until: loop's own
      # exit — a retry loop that exhausts its retries still reports the task green on its own.
      ansible.builtin.set_fact:
        _cm_seen: >-
          {{ _cm_api.json.data.activeTargets | default([])
             | map(attribute='discoveredLabels') | map(attribute='__address__') | list }}

    - name: Assert every registered target is being scraped
      ansible.builtin.assert:
        that:
          - _cm_want | difference(_cm_seen) | length == 0
        fail_msg: >-
          Prometheus has not discovered {{ _cm_want | difference(_cm_seen) | join(', ') }} for owner
          '{{ config_metrics_owner }}' after
          {{ (config_metrics_verify_retries | int) * 5 }}s. The file was written and is valid YAML,
          so check that {{ config_metrics_dir }} is the directory the container's file_sd_configs
          glob actually reads.
        success_msg: >-
          Prometheus is scraping all {{ _cm_want | length }} target(s) for owner
          '{{ config_metrics_owner }}'.
